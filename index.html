<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProofPress Evidence World</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; font-family: system-ui, -apple-system, sans-serif; cursor: grab; }
    body.is-dragging { cursor: grabbing; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hint {
      position: absolute; top: 16px; left: 16px; z-index: 5;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: #a8b0c4; background: rgba(18,26,44,.78);
      border: 1px solid #2a3348; padding: 8px 10px; pointer-events: none;
    }
    .chapters {
      position: absolute; top: 50%; right: 16px; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 5;
    }
    .chapters button {
      width: 10px; height: 10px; border-radius: 50%; padding: 0;
      border: 1px solid #4f7cff; background: transparent; cursor: pointer;
    }
    .chapters button[aria-current="true"] { background: #4f7cff; box-shadow: 0 0 12px rgba(79,124,255,.55); }
    .hud {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
      padding: 28px 20px 22px;
      background: linear-gradient(transparent, rgba(7,11,22,.94) 40%);
      color: #c9d2e3; pointer-events: none;
    }
    .hud .room {
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #4f7cff; margin-bottom: 8px;
    }
    .hud strong { display: block; color: #f4f7ff; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .hud span { display: block; margin-top: 6px; font-size: 14px; line-height: 1.45; max-width: 42rem; opacity: .9; }
    .progress {
      position: absolute; left: 0; top: 0; height: 2px; width: 0%;
      background: linear-gradient(90deg, #2457e6, #14b87a); z-index: 6;
    }
    .gate {
      position: absolute; inset: 0; z-index: 8;
      display: flex; align-items: center; justify-content: center;
      background: rgba(7,11,22,.55); backdrop-filter: blur(2px);
    }
    .gate button {
      font: 600 15px system-ui, sans-serif; color: #fff;
      background: #2457e6; border: 0; padding: 14px 22px; cursor: pointer;
      box-shadow: 0 12px 28px rgba(36,87,230,.35);
    }
    .gate[hidden] { display: none; }
    @media (max-width: 640px) {
      .hud strong { font-size: 18px; }
      .chapters { right: 10px; }
    }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="hint">Drag to look · Scroll to move</div>
  <nav class="chapters" id="chapters" aria-label="Rooms"></nav>
  <div class="hud">
    <div class="room" id="roomLabel">01 — Rules</div>
    <strong id="roomTitle">Agent Instructions</strong>
    <span id="roomBody">Voice, evidence, reuse, and publishing rules stay saved before the agent builds.</span>
  </div>
  <div class="gate" id="gate">
    <button type="button" id="enter">Click to enter evidence world</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const ROOMS = [
      {
        id: 'rules',
        label: '01 — Rules',
        title: 'Agent Instructions',
        body: 'Voice, evidence, reuse, and publishing rules stay saved before the agent builds.',
        z: 0,
      },
      {
        id: 'pipeline',
        label: '02 — Pipeline',
        title: 'Rules → CMS → Review',
        body: 'A visible source of truth: build from approved evidence, then keep release human.',
        z: -14,
      },
      {
        id: 'approved',
        label: '03 — Approved',
        title: 'Claim stage',
        body: 'Decorative panels mirror Approved CMS language. The ledger below is the source of truth.',
        z: -28,
      },
      {
        id: 'held',
        label: '04 — Held',
        title: 'Needs approval',
        body: '“Cuts campaign launch time by 80%.” Held—no approved source. Not used as public proof.',
        z: -42,
      },
    ];

    const APPROVED = [
      {
        label: 'APPROVED · Policy',
        claim: 'If a claim cannot be verified, the workflow flags it for approval instead of fabricating it.',
        note: 'Source: CMS',
        color: '#14b87a',
      },
      {
        label: 'APPROVED · Workflow',
        claim: 'The page is built from your existing components and approved CMS content.',
        note: 'Source: CMS',
        color: '#2457e6',
      },
      {
        label: 'APPROVED · Policy',
        claim: 'Every proposed change is visible for human review before it goes live.',
        note: 'Source: CMS',
        color: '#14b87a',
      },
    ];

    let progress = 0;
    let targetProgress = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let yaw = 0;
    let pitch = 0;
    let targetYaw = 0;
    let targetPitch = 0;
    let running = false;
    let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b16);
    scene.fog = new THREE.Fog(0x070b16, 10, 40);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 2.1, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x6a7aaa, 0.5));
    const key = new THREE.DirectionalLight(0xffffff, 0.9);
    key.position.set(5, 10, 6);
    scene.add(key);
    const blue = new THREE.PointLight(0x2457e6, 1.2, 28);
    blue.position.set(-3, 3, 2);
    scene.add(blue);
    const mint = new THREE.PointLight(0x14b87a, 0.7, 22);
    mint.position.set(4, 2, -20);
    scene.add(mint);

    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0b1020, metalness: 0.15, roughness: 0.92 });
    const gridMat = new THREE.LineBasicMaterial({ color: 0x1a2438, transparent: true, opacity: 0.7 });

    function addFloor(zCenter) {
      const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, zCenter);
      scene.add(floor);
      const grid = new THREE.GridHelper(18, 18, 0x2457e6, 0x1a2438);
      grid.position.z = zCenter;
      grid.material.opacity = 0.4;
      grid.material.transparent = true;
      scene.add(grid);
    }

    function makeTextPanel(title, lines, accent, w = 512, h = 340) {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#121a2c';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = accent;
      ctx.fillRect(0, 0, 10, h);
      ctx.fillStyle = '#a8b0c4';
      ctx.font = '600 20px system-ui, sans-serif';
      ctx.fillText(title, 28, 44);
      ctx.fillStyle = '#f4f7ff';
      ctx.font = '500 26px Georgia, serif';
      let y = 100;
      for (const line of wrap(ctx, lines, w - 60)) {
        ctx.fillText(line, 28, y);
        y += 34;
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 4;
      return tex;
    }

    function wrap(ctx, text, maxWidth) {
      const words = text.split(' ');
      const out = [];
      let line = '';
      for (const word of words) {
        const test = line + word + ' ';
        if (ctx.measureText(test).width > maxWidth && line) {
          out.push(line.trim());
          line = word + ' ';
        } else line = test;
      }
      if (line.trim()) out.push(line.trim());
      return out.slice(0, 5);
    }

    function makeFramedCard(tex, accentHex, width = 2.4, height = 1.6) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x121a2c, metalness: 0.1, roughness: 0.75 })
      );
      group.add(body);
      const rim = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.02, height + 0.02, 0.02),
        new THREE.MeshStandardMaterial({
          color: accentHex, emissive: accentHex, emissiveIntensity: 0.35, metalness: 0.4, roughness: 0.35,
        })
      );
      rim.position.z = -0.05;
      group.add(rim);
      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(width - 0.2, height - 0.15),
        new THREE.MeshBasicMaterial({ map: tex })
      );
      face.position.z = 0.05;
      group.add(face);
      return group;
    }

    // Room 1 — Rules
    addFloor(0);
    {
      const tex = makeTextPanel('AGENT INSTRUCTIONS', 'Voice, evidence, reuse, and publishing rules. The agent starts here—not with a blank guess.', '#2457e6');
      const mono = makeFramedCard(tex, 0x2457e6, 3.2, 2.1);
      mono.position.set(0, 1.6, -2.2);
      scene.add(mono);
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.8, 0.035, 12, 64),
        new THREE.MeshStandardMaterial({ color: 0x4f7cff, emissive: 0x2457e6, emissiveIntensity: 0.45 })
      );
      ring.position.set(0, 1.6, -2.2);
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);
    }

    // Room 2 — Pipeline
    addFloor(-14);
    const stations = [
      { t: '01 SET RULES', c: 'Save Agent Instructions before building.', color: 0x2457e6, x: -3.1 },
      { t: '02 BUILD FROM CMS', c: 'Use Approved proof and the design system.', color: 0x14b87a, x: 0 },
      { t: '03 REVIEW', c: 'Human decision before release.', color: 0xf0a202, x: 3.1 },
    ];
    stations.forEach((s, i) => {
      const tex = makeTextPanel(s.t, s.c, '#' + s.color.toString(16).padStart(6, '0'), 420, 280);
      const card = makeFramedCard(tex, s.color, 2.2, 1.45);
      card.position.set(s.x, 1.45, -14);
      card.userData.floatPhase = i * 1.1;
      scene.add(card);
    });

    // Room 3 — Approved
    addFloor(-28);
    APPROVED.forEach((a, i) => {
      const tex = makeTextPanel(a.label, a.claim + '  ·  ' + a.note, a.color);
      const card = makeFramedCard(tex, parseInt(a.color.slice(1), 16), 2.35, 1.55);
      card.position.set(-2.7 + i * 2.7, 1.5, -28);
      card.userData.floatPhase = i * 0.9;
      scene.add(card);
    });
    {
      const portal = new THREE.Mesh(
        new THREE.TorusGeometry(1.4, 0.04, 16, 80),
        new THREE.MeshStandardMaterial({ color: 0x14b87a, emissive: 0x14b87a, emissiveIntensity: 0.5 })
      );
      portal.position.set(0, 1.55, -30.5);
      scene.add(portal);
    }

    // Room 4 — Held
    addFloor(-42);
    {
      const tex = makeTextPanel(
        'NEEDS APPROVAL — NOT USED',
        'Cuts campaign launch time by 80%. No approved source. Held outside the public claim set.',
        '#f0a202'
      );
      const held = makeFramedCard(tex, 0xf0a202, 3.0, 1.9);
      held.position.set(0, 1.55, -42);
      scene.add(held);
      const gatePosts = [-2.2, 2.2].map((x) => {
        const p = new THREE.Mesh(
          new THREE.BoxGeometry(0.12, 2.4, 0.12),
          new THREE.MeshStandardMaterial({ color: 0xf0a202, emissive: 0xf0a202, emissiveIntensity: 0.25 })
        );
        p.position.set(x, 1.2, -40.2);
        scene.add(p);
        return p;
      });
      void gatePosts;
    }

    // Path cameras: lerp between room viewpoints
    const path = ROOMS.map((r) => ({
      pos: new THREE.Vector3(0, 2.15, r.z + 7.2),
      look: new THREE.Vector3(0, 1.35, r.z - 1.5),
    }));

    function setProgress(p) {
      targetProgress = THREE.MathUtils.clamp(p, 0, 1);
    }

    function roomIndexFromProgress(p) {
      const n = ROOMS.length - 1;
      return Math.round(p * n);
    }

    const chapters = document.getElementById('chapters');
    ROOMS.forEach((r, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.title = r.title;
      b.addEventListener('click', () => setProgress(i / (ROOMS.length - 1)));
      chapters.appendChild(b);
    });

    function updateHud() {
      const idx = roomIndexFromProgress(progress);
      const room = ROOMS[idx];
      document.getElementById('roomLabel').textContent = room.label;
      document.getElementById('roomTitle').textContent = room.title;
      document.getElementById('roomBody').textContent = room.body;
      document.getElementById('progress').style.width = `${progress * 100}%`;
      [...chapters.children].forEach((el, i) => {
        el.setAttribute('aria-current', i === idx ? 'true' : 'false');
      });
    }

    function samplePath(p) {
      const n = path.length - 1;
      const f = p * n;
      const i = Math.min(Math.floor(f), n - 1);
      const t = f - i;
      const ease = t * t * (3 - 2 * t);
      const pos = path[i].pos.clone().lerp(path[i + 1].pos, ease);
      const look = path[i].look.clone().lerp(path[i + 1].look, ease);
      return { pos, look };
    }

    // Input
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!running) return;
      setProgress(targetProgress + e.deltaY * 0.00055);
    }, { passive: false });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (!running) return;
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      document.body.classList.add('is-dragging');
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!dragging || !running) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      targetYaw -= dx * 0.0035;
      targetPitch -= dy * 0.0025;
      targetPitch = THREE.MathUtils.clamp(targetPitch, -0.35, 0.35);
      targetYaw = THREE.MathUtils.clamp(targetYaw, -0.7, 0.7);
    });
    function endDrag(e) {
      dragging = false;
      document.body.classList.remove('is-dragging');
      try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    renderer.domElement.addEventListener('pointerup', endDrag);
    renderer.domElement.addEventListener('pointercancel', endDrag);

    // Touch scroll via vertical drag when not orbiting much — also map vertical drag to progress when two-finger-ish: use shift-free vertical if movement mostly vertical
    let accumY = 0;
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!dragging || !running) return;
      // gentle progress from vertical drag
      if (Math.abs(e.movementY) > Math.abs(e.movementX) * 1.4) {
        accumY += e.movementY;
        if (Math.abs(accumY) > 24) {
          setProgress(targetProgress + Math.sign(accumY) * 0.04);
          accumY = 0;
        }
      }
    });

    document.getElementById('enter').addEventListener('click', () => {
      document.getElementById('gate').hidden = true;
      running = true;
    });

    // Offscreen pause for parent iframe
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) running = false;
    });
    window.addEventListener('message', (e) => {
      if (e.data === 'pp-pause') running = false;
      if (e.data === 'pp-resume') running = true;
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      progress += (targetProgress - progress) * (reduced ? 1 : 1 - Math.pow(0.001, dt));
      yaw += (targetYaw - yaw) * (1 - Math.pow(0.0008, dt));
      pitch += (targetPitch - pitch) * (1 - Math.pow(0.0008, dt));
      if (!dragging) {
        targetYaw *= 0.98;
        targetPitch *= 0.98;
      }

      const { pos, look } = samplePath(progress);
      camera.position.copy(pos);
      const lookTarget = look.clone();
      // orbit offset
      const offset = new THREE.Vector3(
        Math.sin(yaw) * 1.8,
        pitch * 2.2,
        Math.cos(yaw) * 0.6 - 0.4
      );
      camera.position.add(offset);
      camera.lookAt(lookTarget);

      // float cards
      const t = clock.elapsedTime;
      scene.traverse((obj) => {
        if (obj.userData.floatPhase != null) {
          obj.position.y = 1.45 + Math.sin(t * 0.9 + obj.userData.floatPhase) * 0.08;
        }
      });

      updateHud();
      if (document.hidden) return;
      renderer.render(scene, camera);
    }
    animate();
    updateHud();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Keyboard
    addEventListener('keydown', (e) => {
      if (!running) return;
      if (e.key === 'ArrowDown' || e.key === 'PageDown') setProgress(targetProgress + 0.08);
      if (e.key === 'ArrowUp' || e.key === 'PageUp') setProgress(targetProgress - 0.08);
      if (e.key === '1') setProgress(0);
      if (e.key === '2') setProgress(1 / 3);
      if (e.key === '3') setProgress(2 / 3);
      if (e.key === '4') setProgress(1);
    });
  </script>
</body>
</html>
